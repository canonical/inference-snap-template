# This workflow is triggered when a label is added to a pull request.
# It runs the build/test workflow depending on the label applied to the PR.
name: PR Label

on:
  pull_request:
    types: [ labeled ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build-test:
    # The applied label is used to select build/test tasks and as job's display name.
    name: ${{ github.event.label.name }}
    uses: canonical/inference-snaps-dev/.github/workflows/reuse-pr-build-test.yaml@v2
    with:
      trigger-label: ${{ github.event.label.name }}
      pr-number: "${{ github.event.pull_request.number }}"
      build-runner: |
        [
          "ubuntu-24.04",
          "ubuntu-24.04-arm"
        ]
      # TODO: Adjust the test matrix to match the target hardware/engines.
      test-jobs-matrix: |
        [
          {
            "job-queue": "maas-systemtests-amd64",
            "provision-data": "distro: noble",
            "select-engine": "cpu",
            "test-chat-tps": true
          },
          {
            "job-queue": "anbox-nvidia-amd64",
            "provision-data": "distro: noble",
            "install-nvidia-driver-version": 595,
            "select-engine": "nvidia-gpu",
            "test-chat-tps": true,
            "expected-tps": 9.4
          }
        ]
      # TODO: Replace with the snap name.
      snap-name: <snap-name>
      testflinger-client-id: ${{ vars.TESTFLINGER_CLIENT_ID }}
    secrets:
      store-credentials: ${{ secrets.STORE_LOGIN_PR }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
      testflinger-secret-key: ${{ secrets.TESTFLINGER_SECRET_KEY }}
